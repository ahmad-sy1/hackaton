name: CI

# Runs on every pull request and on each new commit pushed to it
# (the "synchronize" event). Keeps the PR from merging while checks fail.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "h1-sportschool-de-kast/**"
      - ".github/workflows/ci.yml"

# A newer push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format:check + lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: h1-sportschool-de-kast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: h1-sportschool-de-kast/package-lock.json

      - run: npm ci

      - run: npm run check
