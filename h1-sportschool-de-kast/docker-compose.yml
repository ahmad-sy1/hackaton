# Lokale PostgreSQL voor de ontwikkelomgeving.
# Start met:  docker compose up -d
# Stop met:   docker compose down          (data blijft in het volume staan)
# Wissen:     docker compose down -v       (verwijdert ook de data)
#
# De gebruikersnaam, het wachtwoord en de databasenaam hieronder komen exact
# overeen met de DATABASE_URL in .env.example.
services:
  db:
    image: postgres:17
    container_name: dekast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dekast
      POSTGRES_PASSWORD: dekast
      POSTGRES_DB: dekast
    ports:
      - "5432:5432"
    volumes:
      - dekast-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dekast -d dekast"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dekast-db-data:
